[client]
toolbarMode = "viewer"

# KIA · Garden Dashboard Theme

[theme]
base = "light"
primaryColor = "#C62828"
backgroundColor = "#F5F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A2E"
linkColor = "#C62828"
borderColor = "#E0E3EA"
codeTextColor = "#37474F"
codeBackgroundColor = "#ECEFF1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
linkUnderline = false

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 500, 500]

redColor    = "#E53935"
orangeColor = "#F4511E"
yellowColor = "#F9A825"
greenColor  = "#2E7D32"
blueColor   = "#1565C0"
violetColor = "#6A1B9A"
grayColor   = "#546E7A"

chartCategoricalColors = [
    "#C62828",
    "#F9A825",
    "#1565C0",
    "#00695C",
    "#0097A7",
    "#424242",
    "#37474F",
    "#78909C",
]

chartSequentialColors = [
    "#FFCDD2",
    "#EF9A9A",
    "#E57373",
    "#EF5350",
    "#F44336",
    "#E53935",
    "#D32F2F",
    "#C62828",
    "#B71C1C",
    "#7F0000",
]

dataframeBorderColor           = "#E0E3EA"
dataframeHeaderBackgroundColor = "#F5F6FA"

[theme.sidebar]
backgroundColor          = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor                = "#1A1A2E"
borderColor              = "#E0E3EA"
primaryColor             = "#C62828"
